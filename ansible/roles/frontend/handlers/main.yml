---
# ansible/roles/frontend/handlers/main.yml

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: true

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
  become: true

- name: restart pm2 app
  command: pm2 restart all
  become: true
  become_user: "{{ frontend_user }}"
  ignore_errors: true