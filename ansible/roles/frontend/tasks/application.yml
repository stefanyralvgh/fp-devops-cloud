---
- name: Create frontend user
  user:
    name: "{{ frontend_user }}"
    comment: "Frontend application user"
    shell: /bin/bash
    create_home: yes
    system: yes

- name: Create /opt directory
  file:
    path: "/opt"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Remove existing repository if present
  file:
    path: "{{ frontend_repo_dir }}"
    state: absent
  become: true

- name: Create repository directory with correct ownership
  file:
    path: "{{ frontend_repo_dir }}"
    state: directory
    owner: "{{ frontend_user }}"
    group: "{{ frontend_group }}"
    mode: '0755'

- name: Clone devops-rampup repository
  git:
    repo: "{{ frontend_repo_url }}"
    dest: "{{ frontend_repo_dir }}"
    version: "{{ frontend_repo_branch }}"
    force: yes
    accept_hostkey: yes
  environment:
    GIT_TERMINAL_PROMPT: '0'
  become_user: "{{ frontend_user }}"
  notify: restart pm2 app

- name: Create symlink to movie-analyst-ui
  file:
  src: "{{ frontend_repo_dir }}/{{ frontend_subdirectory }}"
  dest: "{{ frontend_app_dir }}"
  state: link
  force: yes