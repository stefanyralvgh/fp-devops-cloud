---
# ansible/roles/frontend/tasks/service.yml

- name: Check if PM2 process is already running
  command: pm2 list
  register: pm2_status
  become: true
  become_user: "{{ app_user }}"
  changed_when: false
  failed_when: false

- name: Stop existing PM2 processes
  command: pm2 delete all
  become: true
  become_user: "{{ app_user }}"
  when: "'movie-analyst-ui' in pm2_status.stdout"
  ignore_errors: true

- name: Start application with PM2
  command: pm2 start {{ app_dir }}/ecosystem.config.js
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  register: pm2_start

- name: Save PM2 process list
  command: pm2 save
  become: true
  become_user: "{{ app_user }}"

- name: Wait for application to start
  wait_for:
    port: 3000
    host: localhost
    delay: 5
    timeout: 60
    state: started

- name: Verify application is responding
  uri:
    url: http://localhost:3000
    status_code: 200
    timeout: 10
  register: app_health
  retries: 3
  delay: 5
  until: app_health.status == 200