---
- name: Check if PM2 process is already running
  command: pm2 list
  become: true
  become_user: "{{ frontend_user }}"
  register: pm2_status
  changed_when: false
  failed_when: false

- name: Stop existing PM2 processes
  command: pm2 delete all
  become: true
  become_user: "{{ frontend_user }}"
  when: "'movie-analyst-ui' in pm2_status.stdout"
  ignore_errors: true

- name: Verify application directory exists
  stat:
    path: "{{ frontend_app_dir }}"
  register: app_dir_stat
  
- name: Fail if application directory doesn't exist
  fail:
    msg: "Application directory {{ frontend_app_dir }} does not exist. Repository clone may have failed."
  when: not app_dir_stat.stat.exists

- name: Start application with PM2
  command: pm2 start {{ frontend_app_dir }}/ecosystem.config.js
  args:
    chdir: "{{ frontend_app_dir }}"
  become: true
  become_user: "{{ frontend_user }}"
  register: pm2_start

- name: Save PM2 process list
  command: pm2 save
  become: true
  become_user: "{{ frontend_user }}"

- name: Wait for application to start
  wait_for:
    port: "{{ frontend_port }}"
    host: localhost
    delay: 5
    timeout: 60
    state: started

- name: Verify application is responding
  uri:
    url: "http://localhost:{{ frontend_port }}"
    status_code: 200
    timeout: 10
  register: app_health
  retries: 3
  delay: 5
  until: app_health.status == 200