---
# ansible/roles/frontend/tasks/nginx.yml

- name: Check if Nginx is installed
  command: nginx -v
  register: nginx_check
  failed_when: false
  changed_when: false

- name: Enable nginx repository (Amazon Linux)
  command: amazon-linux-extras install nginx1 -y
  when: nginx_check.rc != 0
  become: true

- name: Install nginx
  yum:
    name: nginx
    state: present
  become: true

- name: Ensure Nginx conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'
  become: true

- name: Remove default server block from main config
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*server\s*{.*'
    state: absent
  become: true
  notify: restart nginx

- name: Remove lines between server { and its closing }
  replace:
    path: /etc/nginx/nginx.conf
    regexp: '(\s*server\s*\{[\s\S]*?\})'
    replace: ''
  become: true
  notify: restart nginx

- name: Create Nginx configuration for movie-analyst
  copy:
    dest: /etc/nginx/conf.d/movie-analyst.conf
    content: |
      server {
          listen 80;
          server_name _;

          # Frontend - Proxy to React app running on PM2
          location / {
              proxy_pass http://localhost:{{ frontend_port }};
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Backend API - Proxy to ALB
          location /api/ {
              proxy_pass http://{{ backend_alb_dns }}/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              
              # Remove /api prefix when forwarding
              rewrite ^/api/(.*) /$1 break;
          }

          # Health check endpoint
          location /health {
              access_log off;
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }
      }
    mode: '0644'
  become: true
  notify: restart nginx

- name: Test Nginx configuration
  command: nginx -t
  become: true
  changed_when: false

- name: Ensure Nginx is started and enabled
  systemd:
    name: nginx
    state: started
    enabled: true
  become: true