- name: Check if Nginx is installed
  command: nginx -v
  register: nginx_check
  changed_when: false
  failed_when: false
  tags: nginx

- name: Enable nginx repository (Amazon Linux)
  command: amazon-linux-extras enable nginx1
  args:
    creates: /etc/yum.repos.d/nginx.repo
  tags: nginx

- name: Install nginx
  yum:
    name: nginx
    state: present
  tags: nginx

- name: Ensure Nginx conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'
  tags: nginx

- name: Configure nginx main config (remove default server)
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: validate and reload nginx
  tags: nginx

- name: Configure Nginx reverse proxy
  template:
    src: nginx-frontend.conf.j2
    dest: /etc/nginx/conf.d/frontend.conf
    mode: '0644'
  notify: validate and reload nginx
  tags: nginx

- name: Ensure Nginx is started and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes
  tags: nginx
