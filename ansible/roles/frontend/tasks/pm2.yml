---
# ansible/roles/frontend/tasks/pm2.yml

- name: Install PM2 globally
  npm:
    name: pm2
    global: true
    state: present
  become: true

- name: Create symbolic link for PM2 in user PATH
  file:
    src: /usr/bin/pm2
    dest: /usr/local/bin/pm2
    state: link
  become: true
  ignore_errors: true

- name: Verify PM2 is accessible
  command: pm2 --version
  register: pm2_version
  changed_when: false
  failed_when: false

- name: Debug PM2 accessibility
  debug:
    msg: "PM2 version: {{ pm2_version.stdout | default('PM2 not found in PATH') }}"

- name: Generate PM2 startup systemd unit
  command: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  become: true
  register: pm2_startup
  changed_when: "'already registered' not in pm2_startup.stdout"

- name: Enable PM2 service
  systemd:
    name: pm2-{{ app_user }}
    enabled: true
  become: true
  ignore_errors: true