---
# Node.js version
nodejs_version: "16"

# Application configuration
app_name: "movie-analyst-api"
app_user: "ec2-user"
app_directory: "/opt/movie-analyst-api"
app_repo_url: "https://github.com/aljoveza/devops-rampup.git"
app_repo_branch: "master"
app_subdirectory: "movie-analyst-api"

# PM2 configuration
pm2_app_name: "movie-analyst-api"
pm2_instances: 1
pm2_exec_mode: "fork"
pm2_max_memory_restart: "500M"

# Database configuration (from inventory + vault)
db_host: "{{ db_endpoint }}"
db_port: 3306
db_name: "movie_db"  
db_user: "admin"
db_password: "{{ vault_db_password }}"

# Application settings
app_port: 3000
node_env: "production"