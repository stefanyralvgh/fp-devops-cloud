---
- name: Check if PM2 process is already running
  command: pm2 list
  become_user: "{{ app_user }}"
  register: pm2_list
  changed_when: false
  failed_when: false

- name: Start application with PM2
  command: pm2 start {{ app_directory }}/ecosystem.config.js
  become: yes
  become_user: "{{ app_user }}"
  when:
    - pm2_list.stdout is defined
    - pm2_app_name not in pm2_list.stdout

- name: Save PM2 process list
  command: pm2 save
  become_user: "{{ app_user }}"
  when: pm2_app_name not in pm2_list.stdout

- name: Reload application if already running
  command: pm2 reload {{ pm2_app_name }}
  become_user: "{{ app_user }}"
  when: pm2_app_name in pm2_list.stdout
  changed_when: false
