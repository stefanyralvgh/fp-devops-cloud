---
- name: Ensure PM2 directories exist
  file:
    path: "/home/{{ app_user }}/.pm2/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - logs
    - pids
  become: yes

- name: Check if PM2 process is already running
  command: pm2 list
  become: yes # ← AGREGAR
  become_user: "{{ app_user }}"
  register: pm2_list
  changed_when: false
  failed_when: false

- name: Debug PM2 list output
  debug:
    var: pm2_list
  when: pm2_list is defined

- name: Start application with PM2
  command: pm2 start {{ app_directory }}/ecosystem.config.js
  args:
    chdir: "{{ app_directory }}"
  become: yes
  become_user: "{{ app_user }}"
  when:
    - pm2_list.stdout is defined
    - pm2_app_name not in pm2_list.stdout

- name: Save PM2 process list
  command: pm2 save
  become: yes
  become_user: "{{ app_user }}"
  when:
    - pm2_list.stdout is defined
    - pm2_app_name not in pm2_list.stdout

- name: Reload application if already running
  command: pm2 reload {{ pm2_app_name }}
  become: yes
  become_user: "{{ app_user }}"
  when:
    - pm2_list.stdout is defined
    - pm2_app_name in pm2_list.stdout
  changed_when: false
