---
# Backend role main tasks orchestration

- name: Include Node.js installation tasks
  include_tasks: nodejs.yml
  tags:
    - nodejs

- name: Include application deployment tasks
  include_tasks: application.yml
  tags:
    - application

- name: Include PM2 configuration tasks
  include_tasks: pm2.yml
  tags:
    - pm2

- name: Install MySQL client
  yum:
    name: mysql
    state: present
  become: true
  tags:
    - database

- name: Include health check configuration
  include_tasks: healthcheck.yml
  tags:
    - healthcheck
