---
# Common role - System baseline configuration
# This role prepares all instances with baseline software and settings

- name: Bootstrap python3-dnf for Ansible
  raw: dnf install -y python3-dnf
  args:
    creates: /usr/lib/python3*/site-packages/dnf
  changed_when: false
  tags: bootstrap

- name: Update all packages to latest version
  dnf:
    name: '*'
    state: latest
    update_cache: yes
  tags: packages

- name: Install base development tools
  dnf:
    name:
      - git
      - wget
      - curl
      - vim
      - unzip
      - tar
      - tree
    state: present
  tags: packages

- name: Install Python 3 and pip
  dnf:
    name:
      - python3
      - python3-pip
    state: present
  tags: packages

- name: Set timezone to America/Bogota
  timezone:
    name: America/Bogota
  tags: system

- name: Ensure NTP is installed and running
  systemd:
    name: chronyd
    state: started
    enabled: yes
  tags: system