---
# Common role - System baseline configuration
# Bootstrap + baseline configuration for Amazon Linux 2


# Bootstrap phase (no Python dependency)

- name: Bootstrap Python dependencies for Ansible
  raw: yum install -y python3 python3-pip python3-libselinux python3-rpm
  changed_when: false
  tags: bootstrap

- name: Gather facts after bootstrap
  setup:
  tags: bootstrap


# System baseline (declarative)

- name: Update all packages to latest version
  package:
    name: "*"
    state: latest
  tags: packages

- name: Install base development tools
  package:
    name:
      - git
      - wget
      - curl
      - vim
      - unzip
      - tar
      - tree
    state: present
  tags: packages

- name: Ensure Python 3 and pip are installed
  package:
    name:
      - python3
      - python3-pip
    state: present
  tags: packages

- name: Set timezone to America/Bogota
  timezone:
    name: America/Bogota
  tags: system

- name: Ensure NTP is installed and running
  systemd:
    name: chronyd
    state: started
    enabled: true
  tags: system

# Security hardening tasks

- name: Disable root login via SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart sshd
  tags: security

- name: Disable password authentication (SSH keys only)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart sshd
  tags: security

- name: Set custom MOTD banner
  template:
    src: motd.j2
    dest: /etc/motd
    mode: '0644'
  tags: system