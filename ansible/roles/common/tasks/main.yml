---
# Common role - System baseline configuration
# This role prepares all instances with baseline software and settings

- name: Ensure Python 3 is installed (bootstrap)
  raw: test -e /usr/bin/python3 || yum install -y python3
  changed_when: false
  check_mode: no
  tags: bootstrap

- name: Set Python 3 as interpreter for Ansible
  set_fact:
    ansible_python_interpreter: /usr/bin/python3
  tags: bootstrap

- name: Update all packages to latest version
  yum:
    name: '*'
    state: latest
    update_cache: yes
  tags: packages

- name: Install base development tools
  yum:
    name:
      - git
      - wget
      - curl
      - vim
      - unzip
      - tar
      - tree
    state: present
  tags: packages

- name: Install Python 3 and pip
  yum:
    name:
      - python3
      - python3-pip
    state: present
  tags: packages

- name: Set timezone to America/Bogota
  timezone:
    name: America/Bogota
  tags: system

- name: Ensure NTP is installed and running
  systemd:
    name: chronyd
    state: started
    enabled: yes
  tags: system