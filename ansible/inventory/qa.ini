[backend]
backend-1 ansible_host=10.0.11.XX
backend-2 ansible_host=10.0.12.XX

[frontend]
frontend-1 ansible_host=10.0.1.XX
frontend-2 ansible_host=10.0.2.XX

[backend:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/movie-analyst-bastion-key
ansible_python_interpreter=/usr/bin/python2
db_endpoint=qa-movie-analyst-db.XXXX.us-east-1.rds.amazonaws.com

[frontend:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/movie-analyst-bastion-key
ansible_python_interpreter=/usr/bin/python2
alb_dns_name=qa-movie-analyst-alb-XXXX.us-east-1.elb.amazonaws.com

# Backend configuration
environment=qa
# db_password comes from vault (group_vars/backend/vault.yml)